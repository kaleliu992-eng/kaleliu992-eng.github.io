# Install this template at .github/workflows/weekly-speeches.yml in the Pages repository.
name: ReadFlow Pages and weekly speeches

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 8 * * 1'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh the weekly speeches before publishing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: readflow-pages
  queue: max

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out the deployed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Refresh and save the weekly speeches
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        shell: bash
        run: |
          python automation/update-speeches.py --output speeches
          git add -- speeches
          if git diff --cached --quiet -- speeches; then
            echo 'Weekly speeches are up to date.'
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update ReadFlow weekly speeches'
            git push origin HEAD:refs/heads/main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage the committed static site
        shell: bash
        run: |
          site="${RUNNER_TEMP}/readflow-pages"
          mkdir -p "$site"
          git archive --format=tar HEAD |
            tar --extract --file=- --directory="$site" --exclude=.github --exclude=automation
          test -s "$site/index.html"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/readflow-pages

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
